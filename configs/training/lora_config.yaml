# LoRA configuration for SurgicalVLM 7B (Qwen2.5-VL-7B)
# Consumed by SurgicalVLM.apply_lora via LoraConfig(**config) and by
# surgical_vlm/training/lora_setup.py.
r: 32
lora_alpha: 32
lora_dropout: 0.05
bias: "none"
target_modules:
  - "q_proj"
  - "k_proj"
  - "v_proj"
  - "o_proj"
  - "gate_proj"
  - "up_proj"
  - "down_proj"
modules_to_save:
  - "embed_tokens"
  - "lm_head"
task_type: "CAUSAL_LM"
